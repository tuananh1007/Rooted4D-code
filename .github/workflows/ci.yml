name: rooted4d-ci

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact core environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Codes/requirements-core.lock
          python -m pip install --no-deps -e Codes
      - name: Run complete dependency-light suite
        run: python -m unittest discover -s Codes/tests -v
      - name: Run image-domain generation and audit
        run: |
          rooted4d-semisynthetic generate --config Codes/configs/semisynthetic_ci.yaml --output /tmp/rooted4d-ci-dataset
          rooted4d-semisynthetic audit --root /tmp/rooted4d-ci-dataset
